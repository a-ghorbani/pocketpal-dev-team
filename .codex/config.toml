approval_policy = "on-request"
default_permissions = "pocketpal"

# The :workspace profile keeps <root>/.git read-only, and this repo's git data
# (including every task worktree's, under .git/modules/repos/pocketpal-ai) lives
# there, so without the override every commit and worktree add asks to escalate.
[permissions.pocketpal]
extends = ":workspace"

[permissions.pocketpal.network]
enabled = true

[permissions.pocketpal.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"

# Caches and state written by builds, device tooling, and tools/*.sh.
[permissions.pocketpal.filesystem]
"~/.cache" = "write"
"~/.gradle" = "write"
"~/.android" = "write"
"~/.yarn" = "write"
"~/.npm" = "write"
"~/.config/pocketpal-dev-team" = "write"
"~/.local/state/pocketpal-dev-team" = "write"

[features]
hooks = true

[mcp_servers.figma-local]
url = "http://127.0.0.1:3845/mcp"
